<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- 2026.11.24 홈화면 바로가기 즉시 접속 -->
<script>
(function() {

  const params =
    new URLSearchParams(window.location.search);

  const club =
    (params.get('club') || '').trim().toUpperCase();

  if (
    params.get('home') === '1' &&
    /^[A-Z]{2}-[0-9]{2,}$/.test(club)
  ) {

    const WEBAPP_URL =
      'https://script.google.com/macros/s/AKfycbw97E4M3EN7oBK_KfkP35plf9H-8ghj0Hv_1EzMGNX-biYNDPQzX_d3cTjcT-MpdbEy/exec';

    document.documentElement.style.visibility = 'hidden';

    window.location.replace(
      WEBAPP_URL + '?club=' + encodeURIComponent(club)
    );

  }

})();
</script>
      
<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>파크골프 대회 운영</title>

<link rel="icon" type="image/png" href="./parkgolf-192.png">
<link rel="apple-touch-icon" href="./parkgolf-192.png">

<meta name="theme-color" content="#086cc5">

<style>
* { box-sizing:border-box; }

body {
  margin:0;
  padding:5px 10px;
  background:#f0f5fa;
  font-family:Arial,"Malgun Gothic",sans-serif;
  color:#073b65;
}

.card {
  max-width:520px;
  margin:4px auto;
  padding:14px;
  background:#fff;
  border-radius:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

h1 {
  margin:4px 0 16px;
  font-size:28px;
  text-align:center;
}

button {
  width:100%;
  min-height:60px;
  border:0;
  border-radius:12px;
  font-size:22px;
  font-weight:700;
  cursor:pointer;
}

.primary {
  background:#086cc5;
  color:#fff;
}

.toggle {
  margin-top:10px;
  background:#e4eef8;
  color:#073b65;
}

.guide {
  display:none;
  margin-top:9px;
  padding:20px 14px 14px;
  border:1px solid #cbdcf0;
  border-radius:12px;
  background:#f3f6f9;
  text-align:center;
  font-size:18px;
  line-height:1.5;
}

.guide-title {
  font-size:20px;
  font-weight:700;
  margin:8px 0;
}

.guide button {
  margin-top:16px;
}

.ready {
  font-weight:700;
  margin:8px 0 24px;
}

</style>
</head>

<body>

<div class="card">

  <h1>🏌️ 파크골프 대회 운영</h1>

  <button class="primary"
          onclick="openClub()">
    대회 운영 화면 열기
  </button>

  <button id="toggleBtn"
          class="toggle"
          onclick="toggleGuide()">
    홈 화면에 바로가기 추가 ▼
  </button>

  <div id="guide" class="guide">

    <div class="guide-title">
      홈 화면에 바로가기를 추가하시겠습니까?
    </div>

    <!-- 카카오톡·밴드 내부 브라우저 안내 -->
    <div id="externalArea"
         style="display:none; padding:16px 0;">

      화면의 <b>점3개(⋮)</b>를 누르시고.<br>

      <b>「다른 브라우저로 열기」</b>를
      선택하십시오.

    </div>

    <!-- 일반 브라우저 바로가기 준비 -->
    <div id="prepareArea"
         style="display:none;">

      홈 화면 바로가기를 만들려면<br>
      아래 버튼을 먼저 누르십시오.

      <button class="primary"
              onclick="prepareShortcut()">
        📲 바로가기 주소 준비
      </button>

    </div>

    <!-- 바로가기 주소 준비 완료 -->
    <div id="readyArea"
         style="display:none;">

      <div class="ready">
        바로가기 주소가 준비되었습니다.
      </div>

      <div id="browserInstructions"></div>

    </div>

  </div>

</div>

<script>

/**************************************************
 * 2026.11.24
 * 파크골프 대회 운영 홈화면 바로가기
 *
 * 기존 운영 웹앱과 독립된 접속 전용 페이지
 *
 * - 카카오톡·밴드 내부 브라우저 감지
 * - 일반 브라우저 등록 안내
 * - setup=1 : 등록 준비 화면
 * - home=1  : 기존 웹앱 바로 연결
 * - 기존 클럽코드 유지
 **************************************************/

const WEBAPP_URL =
  'https://script.google.com/macros/s/AKfycbw97E4M3EN7oBK_KfkP35plf9H-8ghj0Hv_1EzMGNX-biYNDPQzX_d3cTjcT-MpdbEy/exec';

const params =
  new URLSearchParams(window.location.search);

/**************************************************
 * 1. 최초 접속 클럽코드
 **************************************************/

const requestedClub =
  (params.get('club') || '').trim().toUpperCase();

const CLUB_CODE =
  /^[A-Z]{2}-[0-9]{2,}$/.test(requestedClub)
    ? requestedClub
    : 'YJ-20';

/**************************************************
 * 2026.11.24
 * 클럽별 홈화면 바로가기 아이콘 명칭 설정
 **************************************************/

const CLUB_NAME =
  (params.get('clubName') || '').trim()
  || '파크골프 대회 운영';

document.title = CLUB_NAME;     

/**************************************************
 * 2. 브라우저 종류 확인
 **************************************************/

const UA =
  navigator.userAgent || '';

const IS_IN_APP =
  /KAKAOTALK|KAKAO|NAVER.*BAND|BAND/i.test(UA);

const IS_SAMSUNG =
  /SamsungBrowser/i.test(UA);

/**************************************************
 * 2026.11.25
 * 밴드 접속 환경 추정 판별
 **************************************************/

const IS_KAKAO =
  /KAKAOTALK|KAKAO/i.test(UA);

const IS_BAND_LIKE =
  !IS_KAKAO &&
  !IS_SAMSUNG &&
  /Android/i.test(UA) &&
  /Chrome/i.test(UA) &&
  !window.matchMedia('(display-mode: browser)').matches &&
  !window.matchMedia('(display-mode: standalone)').matches;  

const IS_IOS =
  /iPhone|iPad|iPod/i.test(UA) ||
  (navigator.platform === 'MacIntel' &&
   navigator.maxTouchPoints > 1);

/**************************************************
 * 3. 기존 웹앱 연결
 **************************************************/

function openClub() {

  window.location.href =
    WEBAPP_URL +
    '?club=' +
    encodeURIComponent(CLUB_CODE);

}

/**************************************************
 * 4. 홈화면 추가 안내 열기 / 닫기
 **************************************************/

function toggleGuide() {

  const guide =
    document.getElementById('guide');

  const btn =
    document.getElementById('toggleBtn');

  const isOpen =
    guide.style.display === 'block';

  if (isOpen) {

    guide.style.display = 'none';

    btn.textContent =
      '홈 화면에 바로가기 추가 ▼';

    return;

  }

  showGuide();

}

/**************************************************
 * 5. 브라우저별 안내 화면 표시
 **************************************************/

function showGuide() {

  document.getElementById('guide')
    .style.display = 'block';

  document.getElementById('toggleBtn')
    .textContent =
      '홈 화면에 바로가기 추가 ▲';

  // 준비 완료 화면은 그대로 유지
  if (
    document.getElementById('readyArea')
      .style.display === 'block'
  ) {
    return;
  }

  document.getElementById('externalArea')
    .style.display = 'none';

  document.getElementById('prepareArea')
    .style.display = 'none';

  // 카카오톡·밴드 내부 브라우저
  if (IS_IN_APP) {

    const url =
      new URL(window.location.href);

    url.searchParams.set('club', CLUB_CODE);
    url.searchParams.set('setup', '1');
    url.searchParams.delete('home');

    history.replaceState(
      null,
      '',
      url.toString()
    );

    document.getElementById('externalArea')
      .style.display = 'block';

    return;

  }

  // 삼성 인터넷·크롬 등 일반 브라우저
  document.getElementById('prepareArea')
    .style.display = 'block';

}

/**************************************************
 * 6. 바로가기 주소 준비
 **************************************************/

function prepareShortcut() {
            
  const url =
    new URL(window.location.href);

  url.search = '';

  url.searchParams.set('club', CLUB_CODE);
  url.searchParams.set('clubName', CLUB_NAME);    
  url.searchParams.set('home', '1');

  // 주소만 변경하고 화면은 이동하지 않음
  history.replaceState(
    null,
    '',
    url.toString()
  );

  document.getElementById('externalArea')
    .style.display = 'none';

  document.getElementById('prepareArea')
    .style.display = 'none';

  document.getElementById('readyArea')
    .style.display = 'block';

  showBrowserInstructions();

}

/**************************************************
 * 7. 브라우저별 홈화면 추가 안내
 **************************************************/

function showBrowserInstructions() {

  const area =
    document.getElementById(
      'browserInstructions'
    );

  // 삼성 인터넷
  if (IS_SAMSUNG) {

    area.innerHTML =
      '화면 아래 <b>메뉴(☰ 또는 ⋮)</b>를 누르십시오.<br>' +
      '<b>「현재 페이지에 추가」</b>를 선택하십시오.<br>' +
      '<b>「홈 화면」 → 「추가」</b>를 누르십시오.';

    return;

  }

  // 아이폰
  if (IS_IOS) {

    area.innerHTML =
      'Safari의 <b>공유 버튼</b>을 누르십시오.<br>' +
      '<b>「홈 화면에 추가」</b>를 선택하십시오.<br>' +
      '<b>「추가」</b>를 누르십시오.';

    return;

  }

  // Chrome 및 기타 일반 브라우저
  area.innerHTML =
    '브라우저 <b>메뉴(⋮)</b>를 누르십시오.<br>' +
    '<b>「홈 화면에 추가」</b>를 선택하십시오.<br>' +
    '바로가기 추가 항목이 있으면 선택하십시오.';

}

/**************************************************
 * 8. 최초 접속 화면 분기
 * 2026.11.25 밴드 접속 환경 버튼 제어 추가
 **************************************************/

function initializePage() {

  // 홈화면 바로가기 주소로 접속한 경우
  if (params.get('home') === '1') {

    window.location.replace(
      WEBAPP_URL +
      '?club=' +
      encodeURIComponent(CLUB_CODE)
    );

    return;

  }

   // 2026.11.25 밴드 접속 시 안내문 자동 표시
  if (IS_BAND_LIKE) {

    const btn =
      document.getElementById('toggleBtn');

    btn.disabled = true;
    btn.style.opacity = '0.45';
    btn.style.cursor = 'default';

    // 기존 안내 영역 자동 표시
    document.getElementById('guide')
      .style.display = 'block';

    const externalArea =
      document.getElementById('externalArea');

    externalArea.innerHTML =
      '화면 상단의 <b>점3개(⋮)</b>를 누르시고.<br>' +
      '<b>「삼성 인터넷 브라우저에서 열기」</b>를 선택하십시오.';

    externalArea.style.display = 'block';

    return;

  }

  // 등록 준비 주소로 접속한 경우
  if (params.get('setup') === '1') {

    showGuide();

    return;

  }

  // 일반 접속은 최초 두 버튼 화면 유지

}

initializePage();

</script>

</body>
</html>
