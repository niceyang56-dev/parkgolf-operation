<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<!-- 2026.11.26 홈화면 바로가기 즉시 접속 개선 -->
<script>
(function() {

  const params =
    new URLSearchParams(window.location.search);

  const club =
    (params.get('club') || '').trim().toUpperCase();

  if (
    params.get('home') === '1' &&
    params.get('setup') !== '1' &&
    /^[A-Z]{2}-[0-9]{2,}$/.test(club)
  ) {

    const WEBAPP_URL =
      'https://script.google.com/macros/s/AKfycbw97E4M3EN7oBK_KfkP35plf9H-8ghj0Hv_1EzMGNX-biYNDPQzX_d3cTjcT-MpdbEy/exec';

    document.documentElement.style.visibility = 'hidden';

    window.location.replace(
      WEBAPP_URL + '?club=' + encodeURIComponent(club)
    );

  }

})();
</script>

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>파크골프 대회 운영</title>

<link rel="icon" type="image/png"
      href="./parkgolf-192.png">

<link rel="apple-touch-icon"
      href="./parkgolf-192.png">

<meta name="theme-color" content="#086cc5">

<style>
* { box-sizing:border-box; }

body {
  margin:0;
  padding:5px 10px;
  background:#f0f5fa;
  font-family:Arial,"Malgun Gothic",sans-serif;
  color:#073b65;
}

.card {
  max-width:520px;
  margin:4px auto;
  padding:14px;
  background:#fff;
  border-radius:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

h1 {
  margin:4px 0 16px;
  font-size:28px;
  text-align:center;
}

button {
  width:100%;
  min-height:60px;
  border:0;
  border-radius:12px;
  font-size:22px;
  font-weight:700;
  cursor:pointer;
}

.primary {
  background:#086cc5;
  color:#fff;
}

.toggle {
  margin-top:10px;
  background:#e4eef8;
  color:#073b65;
}

.guide {
  display:none;
  margin-top:9px;
  padding:20px 14px 14px;
  border:1px solid #cbdcf0;
  border-radius:12px;
  background:#DDB83F;
  text-align:center;
  font-size:18px;
  line-height:1.5;
}

.guide-title {
  font-size:20px;
  font-weight:700;
  margin:8px 0;
}

.guide button {
  margin-top:16px;
}

.ready {
  font-weight:700;
  margin:8px 0 24px;
}
</style>
</head>

<body>

<div class="card">

  <h1>🏌️ 파크골프 대회 운영</h1>

  <button class="primary"
          onclick="openClub()">
    대회 운영 화면 열기
  </button>

  <button id="toggleBtn"
          class="toggle"
          onclick="toggleGuide()">
    홈 화면에 바로가기 추가 ▼
  </button>

  <div id="guide" class="guide">

    <!-- 카카오톡·밴드 내부 브라우저 안내 -->
    <div id="externalArea"
         style="display:none; padding:16px 0;">

      <div class="guide-title">
        홈 화면에 바로가기를 추가하시겠습니까?
      </div>

      화면의 <b>점3개(⋮)</b>를 누르시고.<br>

      <b>「다른 브라우저로 열기」</b>를
      선택하십시오.

    </div>

    <!-- 일반 브라우저 바로가기 준비 -->
    <div id="prepareArea"
         style="display:none;">

      <b>홈 화면 바로가기를 만들려면<br>
아래 버튼을 먼저 누르십시오.</b>

      <button class="primary"
              onclick="prepareShortcut()">
        📲 바로가기 주소 준비
      </button>

    </div>

    <!-- 바로가기 주소 준비 완료 -->
    <div id="readyArea"
         style="display:none;">

      <div class="ready">
        바로가기 주소가 준비되었습니다.
      </div>

     <div id="browserInstructions"></div>

<!-- 2026.11.27 바로가기 완료 버튼 안내문 -->
<div id="shortcutCompleteNotice"
     style="
       color:#A00000;
       font-size:18px;
       font-weight:700;
       line-height:1.5;
       margin-top:20px;
     ">
  추가 완료 메시지가 표시되면<br>
  아래 버튼을 눌러 주십시오.
</div> 

<!-- 2026.11.26 바로가기 추가 완료 버튼 -->
<button id="shortcutCompleteBtn"
        class="primary"
        style="margin-top:20px;"
        onclick="completeShortcut()">
  ✓ 바로가기 추가 완료
</button>

<!-- 2026.11.26 바로가기 완료 메시지 -->
<div id="shortcutCompleteArea"
     style="display:none;">

  <div style="
    color:#218838;
    font-size:36px;
    font-weight:700;
    margin:10px 0;
  ">
    ✓
  </div>

  <div style="
    color:#218838;
    font-size:20px;
    font-weight:700;
    line-height:1.5;
    margin-bottom:15px;
  ">
    홈 화면에 바로가기 추가가<br>
    완료되었습니다.
  </div>

  <div style="
    font-size:18px;
    line-height:1.5;
  ">
    이제 휴대전화 홈 화면의<br>
    아이콘을 터치하여 이용하십시오.
  </div>

  <button class="primary"
          onclick="closeShortcutGuide()">
    확인
  </button>

</div>

    </div>

  </div>

</div>

<script>

/**************************************************
 * 2026.11.26 정식 운영 개선
 * 파크골프 대회 운영 홈화면 바로가기
 *
 * - 기존 운영 웹앱과 독립된 접속 전용 페이지
 * - 카카오톡·밴드 내부 브라우저 감지
 * - 삼성 인터넷·Chrome 등록 안내
 * - Chrome 실제 페이지 이동 방식 적용
 * - setup=1 : 등록 준비 화면
 * - home=1  : 기존 웹앱 바로 연결
 * - 기존 클럽코드 및 클럽명 유지
 **************************************************/

const WEBAPP_URL =
  'https://script.google.com/macros/s/AKfycbw97E4M3EN7oBK_KfkP35plf9H-8ghj0Hv_1EzMGNX-biYNDPQzX_d3cTjcT-MpdbEy/exec';

const params =
  new URLSearchParams(window.location.search);

/**************************************************
 * 1. 최초 접속 클럽코드
 **************************************************/

const requestedClub =
  (params.get('club') || '').trim().toUpperCase();

const CLUB_CODE =
  /^[A-Z]{2}-[0-9]{2,}$/.test(requestedClub)
    ? requestedClub
    : 'YJ-20';

/**************************************************
 * 클럽별 홈화면 바로가기 아이콘 명칭 설정
 **************************************************/

const CLUB_NAME =
  (params.get('clubName') || '').trim()
  || '파크골프 대회 운영';

document.title = CLUB_NAME;

/**************************************************
 * 2. 브라우저 종류 확인
 **************************************************/

const UA =
  navigator.userAgent || '';

const IS_IN_APP =
  /KAKAOTALK|KAKAO|NAVER.*BAND|BAND/i.test(UA);

const IS_SAMSUNG =
  /SamsungBrowser/i.test(UA);

const IS_KAKAO =
  /KAKAOTALK|KAKAO/i.test(UA);

const IS_BAND_LIKE =
  !IS_KAKAO &&
  !IS_SAMSUNG &&
  /Android/i.test(UA) &&
  /Chrome/i.test(UA) &&
  !window.matchMedia('(display-mode: browser)').matches &&
  !window.matchMedia('(display-mode: standalone)').matches;

const IS_IOS =
  /iPhone|iPad|iPod/i.test(UA) ||
  (navigator.platform === 'MacIntel' &&
   navigator.maxTouchPoints > 1);

/**************************************************
 * 3. 기존 웹앱 연결
 **************************************************/

function openClub() {

  window.location.href =
    WEBAPP_URL +
    '?club=' +
    encodeURIComponent(CLUB_CODE);

}

/**************************************************
 * 4. 홈화면 추가 안내 열기 / 닫기
 **************************************************/

function toggleGuide() {

  const guide =
    document.getElementById('guide');

  const btn =
    document.getElementById('toggleBtn');

  const isOpen =
    guide.style.display === 'block';

  if (isOpen) {

    guide.style.display = 'none';

    btn.textContent =
      '홈 화면에 바로가기 추가 ▼';

    return;

  }

  showGuide();

}

/**************************************************
 * 5. 브라우저별 안내 화면 표시
 **************************************************/

function showGuide() {

  document.getElementById('guide')
    .style.display = 'block';

  // 2026.11.26 안내창 펼친 후 바로가기 버튼 숨김
  document.getElementById('toggleBtn')
    .style.display = 'none';

  // 준비 완료 화면은 그대로 유지
  if (
    document.getElementById('readyArea')
      .style.display === 'block'
  ) {
    return;
  }

  document.getElementById('externalArea')
    .style.display = 'none';

  document.getElementById('prepareArea')
    .style.display = 'none';

  // 카카오톡·밴드 내부 브라우저
  if (IS_IN_APP) {

    const url =
      new URL(window.location.href);

    url.searchParams.set('club', CLUB_CODE);
    url.searchParams.set('clubName', CLUB_NAME);
    url.searchParams.set('setup', '1');
    url.searchParams.delete('home');

    history.replaceState(
      null,
      '',
      url.toString()
    );

    document.getElementById('externalArea')
      .style.display = 'block';

    return;

  }

  // 삼성 인터넷·Chrome 등 일반 브라우저
  document.getElementById('prepareArea')
    .style.display = 'block';

}

/**************************************************
 * 6. 바로가기 주소 준비
 * 2026.11.26 Chrome 개선
 *
 * 주소만 변경하지 않고 실제 페이지 이동
 **************************************************/

function prepareShortcut() {

  const url =
    new URL(window.location.href);

  url.search = '';

  url.searchParams.set('club', CLUB_CODE);
  url.searchParams.set('clubName', CLUB_NAME);
  url.searchParams.set('home', '1');
  url.searchParams.set('setup', '1');

  // 시험에서 검증된 실제 페이지 이동 방식
  window.location.replace(url.toString());

}

/**************************************************
 * 6-1. 바로가기 주소 준비 완료
 * 2026.11.26 신규 추가
 **************************************************/

function showReady() {

  const url =
    new URL(window.location.href);

  // 등록 준비 조건 제거
  url.searchParams.delete('setup');

  history.replaceState(
    null,
    '',
    url.toString()
  );

  document.getElementById('guide')
    .style.display = 'block';

  // 2026.11.26 주소 준비 완료 화면에서 버튼 숨김
  document.getElementById('toggleBtn')
    .style.display = 'none';

  document.getElementById('externalArea')
    .style.display = 'none';

  document.getElementById('prepareArea')
    .style.display = 'none';

  document.getElementById('readyArea')
    .style.display = 'block';

  showBrowserInstructions();

}

/**************************************************
 * 2026.11.26 바로가기 추가 완료 확인
 **************************************************/

function completeShortcut() {

  // 2026.11.27 완료 버튼 안내문 숨기기
  document.getElementById('shortcutCompleteNotice')
    .style.display = 'none';

  // 기존 준비 완료 안내문 숨기기
  document.querySelector('#readyArea .ready')
    .style.display = 'none';

  document.getElementById('browserInstructions')
    .style.display = 'none';

  // 완료 버튼 숨기기
  document.getElementById('shortcutCompleteBtn')
    .style.display = 'none';

  // 완료 메시지 표시
  document.getElementById('shortcutCompleteArea')
    .style.display = 'block';

}

/**************************************************
 * 2026.11.26 완료 확인 후 안내창 닫기
 **************************************************/

function closeShortcutGuide() {

  document.getElementById('guide')
    .style.display = 'none';

  // 2026.11.26 최초 화면 버튼 다시 표시
  document.getElementById('toggleBtn')
    .style.display = 'block';

  document.getElementById('toggleBtn')
    .textContent = '홈 화면에 바로가기 추가 ▼';

}
  

/**************************************************
 * 7. 브라우저별 홈화면 추가 안내
 **************************************************/

function showBrowserInstructions() {

  const area =
    document.getElementById(
      'browserInstructions'
    );

  // 삼성 인터넷
  if (IS_SAMSUNG) {

    area.innerHTML =
      '화면 아래 <b>메뉴(☰ 또는 ⋮)</b> 누르시고<br>' +
      '<b>「현재 페이지에 추가」</b> 선택한 후<br>' +
      '<b>「홈 화면」→ 추가」</b>를 누르세요';

    return;

  }

  // 아이폰
  if (IS_IOS) {

    area.innerHTML =
      'Safari의 <b>공유 버튼</b> 누르시고<br>' +
      '<b>「홈 화면에 추가」</b> 선택한후<br>' +
      '<b>「추가」</b>를 누르십시오.';

    return;

  }

  // 2026.11.26 Chrome 전용 안내문
  if (/Chrome|CriOS/i.test(UA)) {

    area.innerHTML =
      '브라우저 윗쪽<b>메뉴(⋮)</b>를 누르시고<br>' +
      '<b>「설치 및 바로가기 만들기」</b> 선택 후<br>' +
      '<b>「바로가기 만들기」 → 「추가」</b>를 누르세요';

    return;

  }

  // 기타 일반 브라우저
  area.innerHTML =
    '브라우저 <b>메뉴(⋮)</b> 누르시고<br>' +
    '<b>「홈 화면에 추가」</b> 선택 한후<br>' +
    '바로가기 추가 항목이 있으면 선택하세요.';

}

/**************************************************
 * 8. 최초 접속 화면 분기
 * 2026.11.26 Chrome 개선
 **************************************************/

function initializePage() {

  // 홈화면 바로가기 실행
  if (
    params.get('home') === '1' &&
    params.get('setup') !== '1'
  ) {

    window.location.replace(
      WEBAPP_URL +
      '?club=' +
      encodeURIComponent(CLUB_CODE)
    );

    return;

  }

    // 밴드 접속 시 안내문 자동 표시
  if (IS_BAND_LIKE) {

    const btn =
      document.getElementById('toggleBtn');

    // 2026.11.26 밴드 안내 화면에서 버튼 숨김
    btn.style.display = 'none';

    document.getElementById('guide')
      .style.display = 'block';

    const externalArea =
      document.getElementById('externalArea');

    externalArea.innerHTML =
      '<div class="guide-title">' +
      '홈 화면에 바로가기를 추가하시겠습니까?' +
      '</div>' +
      '화면 상단의 <b>점3개(⋮)</b>를 누르시고.<br>' +
      '<b>「삼성 인터넷 브라우저에서 열기」</b>' +
      '를 선택하세요.';

    externalArea.style.display = 'block';

    return;

  }

  // 바로가기 주소 준비 완료
  if (
    params.get('home') === '1' &&
    params.get('setup') === '1'
  ) {

    showReady();

    return;

  }

  // 등록 준비 주소로 접속한 경우
  if (params.get('setup') === '1') {

    showGuide();

    return;

  }

  // 일반 접속은 최초 두 버튼 화면 유지

}

initializePage();

</script>

</body>
</html>
